[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "aio-astro"
version = "0.7.0"
description = "A modular, macOS-first observatory and imaging application"
authors = [{ name = "Peter Dossett" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "astropy>=7,<9",
  "httpx>=0.28,<0.29",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "PySide6-Essentials>=6.8,<7",
  "qasync>=0.28,<0.29",
]

[project.scripts]
aio-astro = "aio_astro.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/aio_astro"]

[tool.hatch.build.targets.sdist]
exclude = ["/vendor/astap/downloads", "/vendor/zwo/downloads", "/vendor/eaf/downloads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
